# The game has no test suite beyond the usage-reporting check; this proves it still builds with the command
# README.md documents, with -Wall added.
name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # Nothing here runs the game, but if a step ever does, it must not count
    # as a use of it (see "Usage reporting" in README.md).
    env:
      TRACE_USAGE_REPORTING: "off"
    steps:
      - uses: actions/checkout@v5
      - name: Install SDL2 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev
      - name: Build (as documented)
        run: g++ -std=c++17 -Wall -pthread tictactoe.cpp -o tictactoe $(pkg-config --cflags --libs sdl2 SDL2_image)
      - name: Check the executable exists
        run: test -x tictactoe
      - name: Check the usage-reporting switch
        # Needs no SDL; checks that off, no, 0, a blank value, a typo or an
        # unreadable settings file all keep reporting off. Sends nothing.
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pthread test/usageReportingTest.cpp -o usageReportingTest
          ./usageReportingTest
