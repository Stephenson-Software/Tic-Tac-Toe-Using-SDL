<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic Tac Toe</title>
<style>
  :root { --bg: #f5f5f7; --fg: #1d1d22; --muted: #5f5f6b; --button: #e2e2ea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141418; --fg: #e8e8ee; --muted: #a0a0ad; --button: #2a2a33; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 600px; margin: 0 auto; padding: 16px; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .hint { color: var(--muted); margin: 0 0 12px; font-size: 0.95rem; }
  #canvas { display: block; width: 100% !important; height: auto !important;
    aspect-ratio: 1 / 1; margin: 0 auto; background: #fff; outline: none; touch-action: manipulation; }
  /* the 3D board (Strata's grid relay) lies over the 2D one, the same size */
  .board { position: relative; }
  #relay { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
  #relay[hidden] { display: none; }
  .controls { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  #view3d[aria-pressed="true"] { outline: 2px solid var(--fg); outline-offset: -2px; }
  #view3d:disabled { cursor: default; opacity: 0.7; }
  #view3d-note { color: var(--muted); font-size: 0.9rem; min-height: 1.1em; margin: 6px 0 0; }
  #status { color: var(--muted); margin: 8px 0; min-height: 1.2em; }
  #new-game, #view3d { font: inherit; padding: 10px 18px; border: 0; border-radius: 10px;
    background: var(--button); color: var(--fg); cursor: pointer; }
  footer { margin: 20px 0 8px; font-size: 0.9rem; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Tic Tac Toe</h1>
  <p class="hint">You are X. Click or tap a box, or use the keys Q W E / A S D / Z X C. The computer plays O.</p>
  <div class="board">
    <canvas id="canvas" width="600" height="600" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    <canvas id="relay" hidden tabindex="-1" aria-label="The board in 3D" oncontextmenu="event.preventDefault()"></canvas>
  </div>
  <div id="status">Loading…</div>
  <div class="controls">
    <button id="new-game" type="button" onclick="location.reload()">New game</button>
    <button id="view3d" type="button" aria-pressed="true">3D view</button>
  </div>
  <p id="view3d-note" role="status"></p>
  <footer><a href="https://danielstephenson.dev/play">More by Daniel Stephenson → danielstephenson.dev/play</a></footer>
</main>
<!-- the 3D board: Strata's grid relay (from Strata's release, copied in by web/build.sh) and the page's side of it -->
<script src="strata-loader.js"></script>
<script src="strata-kit.js"></script>
<script src="grid-relay.js"></script>
<script src="view3d.js"></script>
<script>
  var statusEl = document.getElementById('status');
  var Module = {
    canvas: document.getElementById('canvas'),
    print: function (text) { console.log(text); },
    printErr: function (text) { console.warn(text); },
    setStatus: function (text) { statusEl.textContent = text; },
    monitorRunDependencies: function (left) { statusEl.textContent = left ? 'Loading…' : ''; },
    onRuntimeInitialized: function () { statusEl.textContent = ''; }
  };
  window.addEventListener('error', function () { statusEl.textContent = 'Something went wrong; press New game to try again.'; });
</script>
{{{ SCRIPT }}}
</body>
</html>
